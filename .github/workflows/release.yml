name: Release & Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      create_github_release:
        description: 'Create a GitHub Release entry'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-package:
    name: Package Release Build
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Inspect Toolchain & Environment
        run: |
          echo "### Release Build Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          xcodebuild -version
          swift --version

      - name: Check Code Signing Credentials
        id: signing-check
        env:
          CERT_DATA: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          PROV_DATA: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$CERT_DATA" ] && [ -n "$PROV_DATA" ]; then
            echo "SIGNING_CONFIGURED=true" >> $GITHUB_OUTPUT
            echo "::notice::Apple distribution credentials detected in GitHub Secrets."
            echo "- **Signing Status:** Configured (Distribution Certificate & Provisioning Profile present)" >> $GITHUB_STEP_SUMMARY
          else
            echo "SIGNING_CONFIGURED=false" >> $GITHUB_OUTPUT
            echo "::warning::Apple distribution credentials not configured. Proceeding with unsigned build."
            echo "- **Signing Status:** Unsigned Release Build (Credentials not configured)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Resolve Dependencies
        run: |
          swift package --package-path CloneVoice resolve

      - name: Run Release Test Verification
        run: |
          swift test --package-path CloneVoice

      - name: Configure Temporary Keychain (If Signing Configured)
        if: steps.signing-check.outputs.SIGNING_CONFIGURED == 'true'
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_TEMP_PASSWORD || 'temp_build_keychain_pass_123' }}
        run: |
          echo "Setting up ephemeral keychain for Apple code signing..."
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import distribution certificate
          CERT_FILE=$RUNNER_TEMP/certificate.p12
          echo "$CERT_BASE64" | base64 --decode > $CERT_FILE
          security import $CERT_FILE -k $KEYCHAIN_PATH -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Import provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/release.mobileprovision

      - name: Compile Release Package
        run: |
          mkdir -p build/release
          echo "Compiling optimized release binary..."
          swift build --package-path CloneVoice -c release

      - name: Package Release Archive
        run: |
          VERSION_TAG="${{ inputs.release_version || github.ref_name }}"
          ARCHIVE_NAME="CloneVoice-${VERSION_TAG}-macOS-iOS.zip"
          
          cd CloneVoice
          zip -r "../build/release/${ARCHIVE_NAME}" Package.swift Sources/
          cd ..
          
          echo "ARCHIVE_PATH=build/release/${ARCHIVE_NAME}" >> $GITHUB_ENV
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV
          echo "- **Artifact Generated:** ${ARCHIVE_NAME}" >> $GITHUB_STEP_SUMMARY

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clonevoice-release-${{ github.sha }}
          path: build/release/
          retention-days: 30

      - name: Create GitHub Release (If Triggered on Tag or Enabled)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_github_release == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TITLE="Clone Voice ${VERSION_TAG}"
          IS_PRERELEASE=false
          if [[ "${VERSION_TAG}" == *"alpha"* ]] || [[ "${VERSION_TAG}" == *"beta"* ]]; then
            IS_PRERELEASE=true
          fi

          NOTES="### Clone Voice Release ${VERSION_TAG}
          - **Commit SHA:** \`${{ github.sha }}\`
          - **Architecture:** Swift 6 Strict Concurrency, Apple Liquid Glass Design System
          - **Inference Core:** OpenBMB VoxCPM2 Foundation Model
          - **Signing Status:** ${{ steps.signing-check.outputs.SIGNING_CONFIGURED == 'true' && 'Signed Production Bundle' || 'Unsigned Build' }}
          
          #### Artifacts Included
          - Release Package Archive: \`${ARCHIVE_NAME}\`
          "

          gh release create "${VERSION_TAG}" "${ARCHIVE_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}" \
            --prerelease="${IS_PRERELEASE}" || true
