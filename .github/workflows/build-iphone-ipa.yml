name: Build and Export iPhone IPA

on:
  workflow_dispatch:
    inputs:
      distribution_method:
        description: 'Apple Distribution Method'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
          - enterprise
      build_configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    tags:
      - 'v*'

concurrency:
  group: build-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-export:
    name: Build iPhone IPA (Real Device)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Inspect Toolchain & Environment
        run: |
          echo "### Build Environment Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "- **Xcode Version:**" >> $GITHUB_STEP_SUMMARY
          xcodebuild -version | sed 's/^/  /' >> $GITHUB_STEP_SUMMARY
          echo "- **Swift Version:**" >> $GITHUB_STEP_SUMMARY
          swift --version | head -n 1 | sed 's/^/  /' >> $GITHUB_STEP_SUMMARY
          echo "- **Target Destination:** Generic iOS Device (\`generic/platform=iOS\`)" >> $GITHUB_STEP_SUMMARY
          
          xcodebuild -version
          swift --version
          xcrun --show-sdk-version --sdk iphoneos || true

      - name: Discover Xcode Project & Schemes
        run: |
          echo "Discovering targets in CloneVoice.xcodeproj..."
          xcodebuild -project CloneVoice/CloneVoice.xcodeproj -list

      - name: Resolve Swift Package Dependencies
        run: |
          echo "Resolving SwiftPM package dependencies..."
          swift package --package-path CloneVoice resolve

      - name: Inspect Code Signing Credentials
        id: credentials-check
        env:
          CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          PROV_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build/ipa build/logs
          
          MISSING_SECRETS=()
          if [ -z "$CERT_BASE64" ]; then MISSING_SECRETS+=("IOS_CERTIFICATE_BASE64"); fi
          if [ -z "$PROV_BASE64" ]; then MISSING_SECRETS+=("IOS_PROVISIONING_PROFILE_BASE64"); fi
          if [ -z "$TEAM_ID" ]; then MISSING_SECRETS+=("APPLE_TEAM_ID"); fi
          
          if [ ${#MISSING_SECRETS[@]} -eq 0 ]; then
            echo "CREDENTIALS_CONFIGURED=true" >> $GITHUB_OUTPUT
            echo "::notice::All required Apple Developer signing credentials detected in GitHub Secrets."
          else
            echo "CREDENTIALS_CONFIGURED=false" >> $GITHUB_OUTPUT
            echo "MISSING_COUNT=${#MISSING_SECRETS[@]}" >> $GITHUB_OUTPUT
            echo "MISSING_LIST=${MISSING_SECRETS[*]}" >> $GITHUB_OUTPUT
            echo "::warning::Missing code signing credentials: ${MISSING_SECRETS[*]}"
          fi

      # ---------------------------------------------------------
      # SIGNED BUILD PATH (When credentials are fully provided)
      # ---------------------------------------------------------
      - name: Setup Ephemeral Keychain & Import Certificate
        if: steps.credentials-check.outputs.CREDENTIALS_CONFIGURED == 'true'
        env:
          CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD || 'build_temp_keychain_pass_9988' }}
        run: |
          echo "Creating ephemeral keychain on macOS runner..."
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERT_FILE=$RUNNER_TEMP/distribution.p12
          echo "$CERT_BASE64" | base64 --decode > $CERT_FILE
          
          security import $CERT_FILE \
            -k $KEYCHAIN_PATH \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
            
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "Distribution certificate imported successfully."

      - name: Install Provisioning Profile & Extract Metadata
        if: steps.credentials-check.outputs.CREDENTIALS_CONFIGURED == 'true'
        env:
          PROV_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES_DIR"
          
          TEMP_PROFILE=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROV_BASE64" | base64 --decode > "$TEMP_PROFILE"
          
          # Extract UUID from provisioning profile
          PROFILE_UUID=$(security cms -D -i "$TEMP_PROFILE" | plutil -extract UUID raw -o - -)
          PROFILE_NAME=$(security cms -D -i "$TEMP_PROFILE" | plutil -extract Name raw -o - -)
          
          cp "$TEMP_PROFILE" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"
          echo "INSTALLED_PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "INSTALLED_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "Installed profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Generate ExportOptions.plist
        if: steps.credentials-check.outputs.CREDENTIALS_CONFIGURED == 'true'
        env:
          DIST_METHOD: ${{ inputs.distribution_method || 'development' }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_IDENTIFIER || 'com.clonevoice.app' }}
        run: |
          cat <<EOF > build/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${DIST_METHOD}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${INSTALLED_PROFILE_UUID}</string>
              </dict>
              <key>compileBitcode</key>
              <false/>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          echo "Generated ExportOptions.plist for method: ${DIST_METHOD}"

      - name: Archive CloneVoice for Real Device (Signed)
        if: steps.credentials-check.outputs.CREDENTIALS_CONFIGURED == 'true'
        env:
          CONFIG: ${{ inputs.build_configuration || 'Release' }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Archiving CloneVoice for generic iOS device destination..."
          xcodebuild archive \
            -project CloneVoice/CloneVoice.xcodeproj \
            -scheme CloneVoice \
            -configuration "$CONFIG" \
            -destination "generic/platform=iOS" \
            -archivePath build/CloneVoice.xcarchive \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$INSTALLED_PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            2>&1 | tee build/logs/archive.log
            
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::xcodebuild archive failed."
            exit 1
          fi

      - name: Export Signed iPhone IPA
        if: steps.credentials-check.outputs.CREDENTIALS_CONFIGURED == 'true'
        run: |
          echo "Exporting IPA from archive..."
          xcodebuild -exportArchive \
            -archivePath build/CloneVoice.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa \
            2>&1 | tee build/logs/export.log
            
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::xcodebuild -exportArchive failed."
            exit 1
          fi
          
          # Standardize output filename to CloneVoice-iphone.ipa
          EXPORTED_IPA=$(find build/ipa -name "*.ipa" | head -n 1)
          if [ -f "$EXPORTED_IPA" ]; then
            mv "$EXPORTED_IPA" build/ipa/CloneVoice-iphone.ipa
            IPA_SIZE=$(stat -f%z build/ipa/CloneVoice-iphone.ipa)
            echo "Successfully exported IPA ($IPA_SIZE bytes)."
          else
            echo "::error::Expected IPA not found in export directory."
            exit 1
          fi

      - name: Verify Signed IPA Integrity
        if: steps.credentials-check.outputs.CREDENTIALS_CONFIGURED == 'true'
        run: |
          IPA_PATH="build/ipa/CloneVoice-iphone.ipa"
          if [ ! -s "$IPA_PATH" ]; then
            echo "::error::Exported IPA is empty or missing."
            exit 1
          fi
          
          # Unzip IPA payload to inspect Info.plist and codesign metadata
          unzip -q "$IPA_PATH" -d build/ipa/unpacked
          APP_BUNDLE="build/ipa/unpacked/Payload/CloneVoice.app"
          
          echo "Verifying Code Signature..."
          codesign -dvvv "$APP_BUNDLE" 2>&1 | tee build/logs/codesign-verification.log
          
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP_BUNDLE/Info.plist")
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$APP_BUNDLE/Info.plist")
          BUILD_NUM=$(plutil -extract CFBundleVersion raw "$APP_BUNDLE/Info.plist")
          
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
          
          # Clean up temporary unpacked payload
          rm -rf build/ipa/unpacked

      # ---------------------------------------------------------
      # DIAGNOSTIC PATH (When credentials are missing)
      # ---------------------------------------------------------
      - name: Build Unsigned Archive & Diagnostic Manifest
        if: steps.credentials-check.outputs.CREDENTIALS_CONFIGURED == 'false'
        env:
          CONFIG: ${{ inputs.build_configuration || 'Release' }}
        run: |
          echo "Building unsigned archive for generic iOS device destination..."
          xcodebuild archive \
            -project CloneVoice/CloneVoice.xcodeproj \
            -scheme CloneVoice \
            -configuration "$CONFIG" \
            -destination "generic/platform=iOS" \
            -archivePath build/CloneVoice.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/logs/archive-unsigned.log
            
          if [ ${PIPESTATUS[0]} -ne 0 ] || [ ! -d "build/CloneVoice.xcarchive/Products/Applications/CloneVoice.app" ]; then
            echo "::error::xcodebuild archive failed or app bundle missing."
            exit 1
          fi
            
          # Package real iPhone application into standard IPA container (Payload/CloneVoice.app)
          mkdir -p build/ipa/Payload
          cp -R build/CloneVoice.xcarchive/Products/Applications/CloneVoice.app build/ipa/Payload/
          cd build/ipa
          zip -qr CloneVoice-iphone.ipa Payload
          cp CloneVoice-iphone.ipa CloneVoice.ipa
          cd ../CloneVoice.xcarchive/Products/Applications
          zip -qr "../../../../build/ipa/CloneVoice-unsigned.zip" CloneVoice.app
          cd ../../../..
          rm -rf build/ipa/Payload
          
          IPA_SIZE=$(stat -f%z build/ipa/CloneVoice-iphone.ipa || wc -c < build/ipa/CloneVoice-iphone.ipa)
          echo "Generated CloneVoice-iphone.ipa ($IPA_SIZE bytes)."
          
          # Create diagnostic manifest
          cat <<EOF > build/ipa/SIGNING_DIAGNOSTICS.txt
          =======================================================
          CLONE VOICE — CODE SIGNING DIAGNOSTIC REPORT
          =======================================================
          Status: UNSIGNED BUILD (Distribution credentials not configured)
          
          Missing GitHub Repository Secrets:
          - ${{ steps.credentials-check.outputs.MISSING_LIST }}
          
          Why is code signing required?
          Apple iOS requires all applications installed on physical iPhones to be
          cryptographically signed with an Apple Developer Certificate and linked
          to a Provisioning Profile containing the target device's UDID (for Development
          and Ad Hoc builds) or submitted via App Store Connect (for TestFlight).
          
          Required Steps to Generate an Installable iPhone IPA:
          1. Obtain an Apple Developer account certificate (Development or Distribution).
          2. Export the certificate and private key as a .p12 file:
             base64 -i Certificate.p12 > cert_base64.txt
          3. Download your Provisioning Profile (.mobileprovision) with your iPhone's UDID:
             base64 -i Profile.mobileprovision > prov_base64.txt
          4. Configure the following secrets in GitHub Repository Settings:
             - IOS_CERTIFICATE_BASE64: (content of cert_base64.txt)
             - IOS_CERTIFICATE_PASSWORD: (password of the .p12)
             - IOS_PROVISIONING_PROFILE_BASE64: (content of prov_base64.txt)
             - APPLE_TEAM_ID: (Your 10-character Apple Developer Team ID)
             - IOS_BUNDLE_IDENTIFIER: com.clonevoice.app
          5. Re-run this workflow ("Build and Export iPhone IPA").
          =======================================================
          EOF

      # ---------------------------------------------------------
      # SUMMARY & ARTIFACT PUBLISHING
      # ---------------------------------------------------------
      - name: Generate Build Summary
        if: always()
        run: |
          echo "### iPhone IPA Export Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Destination:** Real Device (\`generic/platform=iOS\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration:** ${{ inputs.build_configuration || 'Release' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Xcode Version:** $(xcodebuild -version | tr '\n' ' ')" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.credentials-check.outputs.CREDENTIALS_CONFIGURED }}" = "true" ]; then
            echo "- **Signing Status:** ✅ Signed (\`${{ inputs.distribution_method || 'development' }}\`)" >> $GITHUB_STEP_SUMMARY
            echo "- **App Version:** ${APP_VERSION} (Build ${BUILD_NUM})" >> $GITHUB_STEP_SUMMARY
            echo "- **Bundle ID:** \`${BUNDLE_ID}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Exported IPA:** \`build/ipa/CloneVoice-iphone.ipa\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 **The signed IPA is ready for direct installation on eligible registered iPhones.**" >> $GITHUB_STEP_SUMMARY
            echo "- **Signing Status:** ⚠️ Unsigned Build (Missing secrets: ${{ steps.credentials-check.outputs.MISSING_LIST }})" >> $GITHUB_STEP_SUMMARY
            echo "- **Exported IPA:** \`build/ipa/CloneVoice-iphone.ipa\` (Ready for sideloading via AltStore / Sideloadly / TrollStore)" >> $GITHUB_STEP_SUMMARY
            echo "- **Diagnostic Report:** Included in artifact as \`SIGNING_DIAGNOSTICS.txt\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **Note:** Configure \`IOS_CERTIFICATE_BASE64\`, \`IOS_PROVISIONING_PROFILE_BASE64\`, and \`APPLE_TEAM_ID\` in repository secrets for official Apple Developer automated codesigning." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload IPA & Diagnostic Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CloneVoice-iOS-IPA
          path: |
            build/ipa/
            build/logs/
          retention-days: 14

      - name: Attach IPA to GitHub Release (If Triggered on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          echo "Attaching iPhone build outputs to GitHub Release ${VERSION_TAG}..."
          if [ -f "build/ipa/CloneVoice-iphone.ipa" ]; then
            gh release upload "${VERSION_TAG}" "build/ipa/CloneVoice-iphone.ipa" --clobber || true
          fi
          if [ -f "build/ipa/CloneVoice.ipa" ]; then
            gh release upload "${VERSION_TAG}" "build/ipa/CloneVoice.ipa" --clobber || true
          fi
          if [ -f "build/ipa/CloneVoice-unsigned.zip" ]; then
            gh release upload "${VERSION_TAG}" "build/ipa/CloneVoice-unsigned.zip" --clobber || true
          fi
          if [ -f "build/ipa/SIGNING_DIAGNOSTICS.txt" ]; then
            gh release upload "${VERSION_TAG}" "build/ipa/SIGNING_DIAGNOSTICS.txt" --clobber || true
          fi

      - name: Clean Up Ephemeral Keychain & Credentials
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            echo "Deleting ephemeral build keychain..."
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true
          rm -rf $RUNNER_TEMP/*.p12 $RUNNER_TEMP/*.mobileprovision || true
          echo "Cleanup complete."
